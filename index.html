    <import asyncio
import random
import json
import os
import time
from fastapi import FastAPI, Request
from fastapi.responses import HTMLResponse, JSONResponse
from fastapi.middleware.cors import CORSMiddleware
import uvicorn
from aiogram import Bot, Dispatcher, types
from aiogram.filters import Command

# ==================== НАСТРОЙКИ ====================
TOKEN = "8886008389:AAFBFtU11on8c3cDOgW6E4ntn5M8kZM58gc" # Замени на токен от BotFather

bot = Bot(token=TOKEN)

DATA_FILE = "data.json"
data = {}

if os.path.exists(DATA_FILE):
    with open(DATA_FILE, "r", encoding="utf-8") as f:
        data = json.load(f)

def save_data():
    with open(DATA_FILE, "w", encoding="utf-8") as f:
        json.dump(data, f, ensure_ascii=False, indent=2)

def get_user(user_id):
    uid = str(user_id)
    if uid not in data:
        data[uid] = {
            "balance": 200000,
            "garage": [],
            "total_rolls": 0
        }
    return data[uid]

# ==================== ЛОГИКА ИГРЫ ====================
def do_roll_logic(user_id, count=1):
    user = get_user(user_id)
    
    # Проверка баланса (примерная цена 1000 за крутку)
    price = 1000 * count
    if user["balance"] < price:
        return {"error": "Недостаточно средств"}
    
    user["balance"] -= price
    results = []
    
    for _ in range(count):
        # Тут твоя логика выпадения (упрощенная для примера)
        rarities = ["common", "rare", "epic", "legendary", "mythic"]
        weights = [65, 25, 7, 2.5, 0.5]
        rarity = random.choices(rarities, weights=weights)[0]
        
        # Генерация номера
        letters = "АВЕКМНОРСТУХ"
        l1 = random.choice(letters)
        l2 = random.choice(letters)
        l3 = random.choice(letters)
        digits = f"{random.randint(1, 999):03d}"
        number = f"{l1}{digits}{l2}{l3} 77"
        
        # Секретный номер (шанс 0.05%)
        if random.random() < 0.0005:
            number = "К026РМ 26"
            rarity = "secret"
            
        user["total_rolls"] += 1
        results.append({
            "number": number,
            "rarity": rarity,
            "region": "77" # Упрощенно
        })
    
    save_data()
    return {"results": results, "balance": user["balance"]}

# ==================== ВЕБ-СЕРВЕР (API) ====================
app = FastAPI()
app.add_middleware(CORSMiddleware, allow_origins=["*"], allow_methods=["*"], allow_headers=["*"])

# Этот эндпоинт обрабатывает нажатие кнопки "Крутить" в Mini App
@app.post("/api/roll")
async def api_roll(request: Request):
    body = await request.json()
    user_id = body.get("user_id")
    count = body.get("count", 1)
    
    if not user_id:
        return JSONResponse({"error": "No user_id"}, status_code=400)
        
    res = do_roll_logic(user_id, count)
    if "error" in res:
        return JSONResponse(res, status_code=400)
        
    return JSONResponse(res)

@app.get("/")
async def get_index():
    with open("index.html", "r", encoding="utf-8") as f:
        html_content = f.read()
    return HTMLResponse(content=html_content)
